name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The two supported Go releases; go.mod requires the older one.
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/wildcsv

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build staticcheck and govulncheck at the versions pinned in tools/go.mod
        run: go -C tools build -o ../bin/ honnef.co/go/tools/cmd/staticcheck golang.org/x/vuln/cmd/govulncheck
      - run: ./bin/staticcheck ./...
      - run: ./bin/govulncheck ./...
      - name: Fuzz each target briefly
        run: |
          for target in FuzzReader FuzzAgainstStdlib FuzzDecode FuzzDetect; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s .
          done
      - name: Release archives, dry run
        run: go run ./internal/cmd/release build --tag v0.0.0 --out dist --dry-run
      - name: Smoke run of the built command
        run: |
          tar -xzf dist/wildcsv_0.0.0_linux_amd64.tar.gz -C dist wildcsv
          ./dist/wildcsv version
          ./dist/wildcsv inspect --json cmd/wildcsv/testdata/orders.csv | grep -q '"delimiter": ";"'
          ./dist/wildcsv check cmd/wildcsv/testdata/orders.csv
